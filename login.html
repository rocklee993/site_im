    .form-container {

      padding: 12px;

      border-radius: 10px;

    .form-container button {

      background: #003366;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .form-container button:hover {
      background: #005580;
      transform: translateY(-2px);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .social-icons a {
      display: inline-block;
      width: 40px;
      height: 40px;
      background: #e6f7ff;

      align-items: center;
      justify-content: center;
      color: #003366;
      font-size: 1.5rem;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.2s ease;

    .social-icons a:hover {

    }

    .divider {
      font-size: 0.9rem;
      color: #777;
      margin: 20px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ccc;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .form-container a {
      color: #0077B6;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .form-container a:hover {
      color: #005580;
