</head>

<body>

  <nav>
    <div class="nav-content">

      <div class="nav-links">

  <section class="hero-main">

      <h1>À Propos de l'Association</h1>
      <p></p>
    </div>

    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="./a_propos_image/image1.jpg" alt="Image 1"></div>
        <div class="swiper-slide"><img src="./a_propos_image/image2.jpg" alt="Image 2"></div>
        <div class="swiper-slide"><img src="./a_propos_image/image3.jpg" alt="Image 3"></div>
      </div>
      <!-- Pagination -->

    <div class="main-content">

      <div class="left-content">
        
        </div>
        
      </div>

  <footer style="background-color: #003366; color: white; padding: 20px 0;">

          <i class="fab fa-facebook"></i> Facebook
        </a>
        <a href="https://twitter.com" target="_blank" style="color: #fff; margin: 0 10px; text-decoration: none;">

        </a>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Smooth scrolling for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          document.querySelector(this.getAttribute('href')).scrollIntoView({
            behavior: 'smooth'
          });
        });
      });

      // Form submission handling
      const form = document.querySelector('.contact-form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alert('Merci pour votre message ! Nous vous répondrons dans les plus brefs délais.');
        form.reset();
      });
    });

    const swiper = new Swiper('.swiper', {
    loop: true,
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
  });
  </script>
